<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Administrador | Lesli Estela</title>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #14171d;
      --card: #1f2632;
      --accent-pink: #e31b6d;
      --accent-cyan: #04c2c9;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top right, #242c3b, #111419);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(31, 38, 50, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-cyan));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      font-size: 1.8rem;
      color: #fff;
      box-shadow: 0 10px 20px rgba(227, 27, 109, 0.3);
    }
    .login-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap i {
      position: absolute;
      left: 14px;
      color: var(--muted);
      font-size: 1.2rem;
    }
    .form-input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      background: #14171d;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(4, 194, 201, 0.3);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-pink), #be123c);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(227, 27, 109, 0.4);
    }
    .alert-box {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
    .alert-success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-home:hover {
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <i class="mdi mdi-shield-lock-outline"></i>
      </div>
      <h1 class="login-title">Panel de Control</h1>
      <p class="login-subtitle">Ingresa tus credenciales para administrar el sitio</p>
    </div>

    <div id="alert" class="alert-box alert-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <div class="input-wrap">
          <i class="mdi mdi-account-outline"></i>
          <input type="text" id="username" class="form-input" placeholder="Usuario administrador" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrap">
          <i class="mdi mdi-lock-outline"></i>
          <input type="password" id="password" class="form-input" placeholder="Contraseña" required />
        </div>
      </div>

      <button type="submit" class="btn-login" id="submit-btn">
        <span>INICIAR SESIÓN</span>
        <i class="mdi mdi-arrow-right"></i>
      </button>
    </form>

    <a href="/" class="back-home">
      <i class="mdi mdi-arrow-left"></i> Volver a la web pública
    </a>
  </div>

  <script>
    // If already logged in, verify token
    const token = localStorage.getItem('lele_token');
    if (token) {
      fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` } })
        .then(r => r.json())
        .then(d => {
          if (d.success) window.location.href = '/admin';
        }).catch(() => {});
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="mdi mdi-loading mdi-spin"></i> Verificando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success) {
          localStorage.setItem('lele_token', data.token);
          localStorage.setItem('lele_user', JSON.stringify(data.user));
          alertBox.className = 'alert-box alert-success';
          alertBox.textContent = 'Acceso correcto. Redirigiendo...';
          alertBox.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/admin';
          }, 800);
        } else {
          alertBox.className = 'alert-box alert-error';
          alertBox.textContent = data.message || 'Usuario o contraseña incorrectos.';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert-box alert-error';
        alertBox.textContent = 'Error de conexión con el servidor.';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>INICIAR SESIÓN</span> <i class="mdi mdi-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
